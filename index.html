
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoVerse</title>
</head>
<body>

  <h1>🌍 LingoVerse</h1>
  <p>Your personal language learning adventure.</p>

  <h2>Choose your skill</h2>

  <button onclick="showSkill('Writing')">✍️ Writing</button>
  <button onclick="showSkill('Speaking')">🎤 Speaking</button>
  <button onclick="showSkill('Listening')">🎧 Listening</button>
  <button onclick="showSkill('Reading')">📖 Reading</button>
  <button onclick="showSkill('Grammar')">🧩 Grammar</button>
  <button onclick="showSkill('Vocabulary')">🗂️ Vocabulary</button>

  <hr>

  <h2 id="skill-title">Welcome!</h2>
  <p id="skill-description">Select a skill to get started.</p>

  <hr>

  <h2>📚 My Flashcards</h2>

  <h3>📁 My Folders</h3>

  <input type="text" id="folder-name"
         placeholder="New folder name">

  <button onclick="addFolder()">Create Folder</button>

  <p>
    <label for="folder-select">Choose folder:</label>
    <select id="folder-select" onchange="showFlashcards()"></select>
  </p>

  <h3>Add New Word</h3>

  <input type="text" id="english-word"
         placeholder="English word">

  <input type="text" id="czech-word"
         placeholder="Czech translation">

  <button onclick="addFlashcard()">Add Flashcard</button>

  <h3>My Vocabulary</h3>
  <div id="flashcard-list"></div>

  <hr>

  <h2>My Progress</h2>
  <p>⭐ XP: 0</p>
  <p>🏆 Level: 1</p>

  <script>
    function showSkill(skill) {
      document.getElementById("skill-title").textContent = skill;
      document.getElementById("skill-description").textContent =
        "Welcome to your " + skill + " practice!";
    }

    const flashcards = JSON.parse(
      localStorage.getItem("lingoverse-flashcards") || "[]"
    );

    let folders = JSON.parse(
      localStorage.getItem("lingoverse-folders") || '["General"]'
    );

    // Keep the original folder for existing words.
    if (!folders.includes("General")) {
      folders.unshift("General");
    }

    function saveFolders() {
      localStorage.setItem(
        "lingoverse-folders",
        JSON.stringify(folders)
      );
    }

    function updateFolderSelect() {
      const select = document.getElementById("folder-select");
      const previous = select.value;
      select.innerHTML = "";

      folders.forEach(function(folder) {
        const option = document.createElement("option");
        option.value = folder;
        option.textContent = folder;
        select.appendChild(option);
      });

      if (folders.includes(previous)) {
        select.value = previous;
      }
    }

    function addFolder() {
      const input = document.getElementById("folder-name");
      const name = input.value.trim();

      if (name === "") {
        alert("Please enter a folder name!");
        return;
      }

      if (folders.some(folder =>
        folder.toLowerCase() === name.toLowerCase()
      )) {
        alert("This folder already exists!");
        return;
      }

      folders.push(name);
      saveFolders();
      updateFolderSelect();

      document.getElementById("folder-select").value = name;
      input.value = "";
      showFlashcards();
    }

    function showFlashcards() {
      const list = document.getElementById("flashcard-list");
      const selectedFolder =
        document.getElementById("folder-select").value;

      list.innerHTML = "";

      const visibleCards = flashcards.filter(function(card) {
        return (card.folder || "General") === selectedFolder;
      });

      if (visibleCards.length === 0) {
        list.textContent = "No words in this folder yet.";
        return;
      }

      visibleCards.forEach(function(card) {
        const item = document.createElement("p");
        item.textContent = card.english + " — " + card.czech;
        list.appendChild(item);
      });
    }

    function addFlashcard() {
      const english =
        document.getElementById("english-word").value.trim();

      const czech =
        document.getElementById("czech-word").value.trim();

      const folder =
        document.getElementById("folder-select").value;

      if (english === "" || czech === "") {
        alert("Please fill in both fields!");
        return;
      }

      flashcards.push({
        english: english,
        czech: czech,
        folder: folder
      });

      localStorage.setItem(
        "lingoverse-flashcards",
        JSON.stringify(flashcards)
      );

      showFlashcards();

      document.getElementById("english-word").value = "";
      document.getElementById("czech-word").value = "";
    }

    saveFolders();
    updateFolderSelect();
    showFlashcards();
  </script>

</body>
</html>
